<rect width="1600" height="1000" fill="#0A101C"/>
<text x="56" y="58" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#63799B" text-anchor="start" letter-spacing="1.6">LOCAL · CLOUD · HYBRID</text>
<text x="56" y="92" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="36" font-weight="700" fill="#EAF0FA" text-anchor="start">Deployment and Cost Strategy</text>
<text x="56" y="136" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="15" font-weight="400" fill="#94A6C4" text-anchor="start">Where training runs and where the application lives are two separate decisions. Treating them as one is what makes GPU cloud bills grow.</text>
<line x1="56" y1="162" x2="1544" y2="162" stroke="#1F2E47" stroke-width="1"/>
<rect x="100" y="225" width="452" height="400" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5" stroke-dasharray="7 6"/>
<clipPath id="clip38"><rect x="100" y="225" width="452" height="400" rx="10"/></clipPath>
<g clip-path="url(#clip38)"><rect x="100" y="225" width="452" height="5" fill="#94A6C4"/></g>
<text x="118" y="251" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="10" font-weight="700" fill="#94A6C4" text-anchor="start" letter-spacing="1.4">OPTION A</text>
<text x="118" y="272" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" fill="#EAF0FA" text-anchor="start">Fully local GPU</text>
<text x="118" y="320" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#7ED957" text-anchor="start" letter-spacing="1.3">STRENGTHS</text>
<text x="118" y="344" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Fixed, predictable cost</text>
<text x="118" y="368" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Raw imagery never leaves the site</text>
<text x="118" y="392" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   No transfer charges on large datasets</text>
<text x="118" y="434" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#FF6B6B" text-anchor="start" letter-spacing="1.3">LIMITATIONS</text>
<text x="118" y="458" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   No elastic scaling</text>
<text x="118" y="482" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Hardware and maintenance are owned</text>
<text x="118" y="506" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Remote access must be built</text>
<text x="118" y="548" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#94A6C4" text-anchor="start" letter-spacing="1.3">BEST WHEN</text>
<text x="118" y="572" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Datasets are large and stay on site</text>
<text x="118" y="596" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Cost must be fixed and predictable</text>
<rect x="596" y="225" width="452" height="400" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5" stroke-dasharray="7 6"/>
<clipPath id="clip39"><rect x="596" y="225" width="452" height="400" rx="10"/></clipPath>
<g clip-path="url(#clip39)"><rect x="596" y="225" width="452" height="5" fill="#94A6C4"/></g>
<text x="614" y="251" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="10" font-weight="700" fill="#94A6C4" text-anchor="start" letter-spacing="1.4">OPTION B</text>
<text x="614" y="272" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" fill="#EAF0FA" text-anchor="start">Fully cloud GPU</text>
<text x="614" y="320" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#7ED957" text-anchor="start" letter-spacing="1.3">STRENGTHS</text>
<text x="614" y="344" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Elastic capacity on demand</text>
<text x="614" y="368" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Native fit with an existing cloud intranet</text>
<text x="614" y="392" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   No hardware ownership</text>
<text x="614" y="434" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#FF6B6B" text-anchor="start" letter-spacing="1.3">LIMITATIONS</text>
<text x="614" y="458" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Multi-day training is expensive</text>
<text x="614" y="482" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Uploading raw campaigns costs bandwidth</text>
<text x="614" y="506" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Idle GPU time is billed unless ephemeral</text>
<text x="614" y="548" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#94A6C4" text-anchor="start" letter-spacing="1.3">BEST WHEN</text>
<text x="614" y="572" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">No GPU hardware is owned</text>
<text x="614" y="596" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Workloads are short and bursty</text>
<rect x="1092" y="225" width="452" height="400" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip40"><rect x="1092" y="225" width="452" height="400" rx="10"/></clipPath>
<g clip-path="url(#clip40)"><rect x="1092" y="225" width="452" height="5" fill="#FFB13D"/></g>
<text x="1110" y="251" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="10" font-weight="700" fill="#FFB13D" text-anchor="start" letter-spacing="1.4">OPTION C</text>
<text x="1110" y="272" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" fill="#EAF0FA" text-anchor="start">Hybrid</text>
<rect x="1356.4" y="233" width="169.60000000000002" height="21" rx="999" fill="#FFB13D" stroke="none" opacity="0.16"/><text x="1441.2" y="247.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#FFB13D" text-anchor="middle" letter-spacing="0.7">recommended baseline</text>
<text x="1110" y="320" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#7ED957" text-anchor="start" letter-spacing="1.3">STRENGTHS</text>
<text x="1110" y="344" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Training stays next to the data and the GPU</text>
<text x="1110" y="368" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Application and metadata stay next to the users</text>
<text x="1110" y="392" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">+   Only selected artifacts cross the boundary</text>
<text x="1110" y="434" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#FF6B6B" text-anchor="start" letter-spacing="1.3">LIMITATIONS</text>
<text x="1110" y="458" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Two environments to govern</text>
<text x="1110" y="482" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Model lineage must span both sides</text>
<text x="1110" y="506" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">-   Sync rules must be explicit</text>
<text x="1110" y="548" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#FFB13D" text-anchor="start" letter-spacing="1.3">BEST WHEN</text>
<text x="1110" y="572" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#EAF0FA" text-anchor="start">Training is heavy and data is local</text>
<text x="1110" y="596" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#EAF0FA" text-anchor="start">Users already live in the cloud</text>
<rect x="100" y="660" width="1444" height="156" rx="14" fill="#0E1524" stroke="#1F2E47" stroke-width="1.5"/>
<rect x="101.5" y="674" width="4" height="128" rx="2" fill="#35D6D0" stroke="none" opacity="0.75"/>
<text x="120" y="687" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#35D6D0" text-anchor="start" letter-spacing="1.5">WHAT CROSSES THE BOUNDARY</text>
<rect x="116" y="704" width="700" height="96" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip41"><rect x="116" y="704" width="700" height="96" rx="10"/></clipPath>
<g clip-path="url(#clip41)"><rect x="116" y="704" width="700" height="5" fill="#35D6D0"/></g>
<text x="134" y="740" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Stays local</text>
<text x="134" y="761" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Raw drone imagery · training datasets · intermediate checkpoints ·</text>
<text x="134" y="779.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">heavy batch inference over full campaigns · synthetic generation runs</text>
<rect x="844" y="704" width="684" height="96" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip42"><rect x="844" y="704" width="684" height="96" rx="10"/></clipPath>
<g clip-path="url(#clip42)"><rect x="844" y="704" width="684" height="5" fill="#4FA8FF"/></g>
<text x="862" y="740" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Synchronized to the cloud</text>
<text x="862" y="761" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Selected checkpoint with its metadata · class mapping · dataset version ·</text>
<text x="862" y="779.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">validation summary · compact previews · reports · artifact manifest</text>
<polyline points="820,752 840,752" fill="none" stroke="#4FA8FF" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-m4FA8FF)"/>
<rect x="100" y="846" width="1444" height="62" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip43"><rect x="100" y="846" width="1444" height="62" rx="10"/></clipPath>
<g clip-path="url(#clip43)"><rect x="100" y="846" width="1444" height="5" fill="#FFB13D"/></g>
<text x="822.0" y="885" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" fill="#EAF0FA" text-anchor="middle">Train where the data and the GPU cost make sense. Serve where the users and the application already are.</text>
<line x1="56" y1="952" x2="1544" y2="952" stroke="#1F2E47" stroke-width="1"/>
<text x="56" y="974" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#63799B" text-anchor="start">yolo-training-inference-orchestration-architecture</text>
<text x="1544" y="974" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11" font-weight="400" fill="#63799B" text-anchor="end">Public-safe architecture documentation · all values illustrative</text>
