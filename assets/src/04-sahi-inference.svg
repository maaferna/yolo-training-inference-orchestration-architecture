<rect width="1600" height="1000" fill="#0A101C"/>
<text x="56" y="58" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#63799B" text-anchor="start" letter-spacing="1.6">HIGH-RESOLUTION SMALL-OBJECT DETECTION</text>
<text x="56" y="92" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="36" font-weight="700" fill="#EAF0FA" text-anchor="start">SAHI Tiled Inference</text>
<text x="56" y="136" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="15" font-weight="400" fill="#94A6C4" text-anchor="start">A small object covering a few pixels of a 4K frame is nearly invisible to a 640-pixel detector. Tiling restores its apparent scale.</text>
<line x1="56" y1="162" x2="1544" y2="162" stroke="#1F2E47" stroke-width="1"/>
<rect x="100" y="240" width="420" height="340" rx="14" fill="#0E1524" stroke="#1F2E47" stroke-width="1.5"/>
<rect x="101.5" y="254" width="4" height="312" rx="2" fill="#35D6D0" stroke="none" opacity="0.75"/>
<text x="120" y="267" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#35D6D0" text-anchor="start" letter-spacing="1.5">1 · SLICE</text>
<rect x="190" y="306" width="240" height="240" rx="6" fill="#101A2C" stroke="#2A3B58" stroke-width="1.5"/>
<line x1="250" y1="306" x2="250" y2="546" stroke="#1F2E47" stroke-width="1"/>
