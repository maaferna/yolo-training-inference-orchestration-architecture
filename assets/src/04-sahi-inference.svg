<text x="134" y="700" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Throughput first</text>
<text x="134" y="721" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12.0" font-weight="400" fill="#63799B" text-anchor="start">1024 px tiles · 25% overlap</text>
<text x="134" y="739.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Fewest forward passes, lowest latency</text>
<text x="134" y="758.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Weakest recall on the smallest objects</text>
<rect x="591" y="664" width="461" height="120" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip35"><rect x="591" y="664" width="461" height="120" rx="10"/></clipPath>
<g clip-path="url(#clip35)"><rect x="591" y="664" width="461" height="5" fill="#7ED957"/></g>
<text x="609" y="700" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Balanced</text>
<text x="609" y="721" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12.0" font-weight="400" fill="#63799B" text-anchor="start">800 px tiles · 33% overlap</text>
<text x="609" y="739.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Documented starting point for batch work</text>
<text x="609" y="758.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Tune from measurements, not from defaults</text>
<rect x="1066" y="664" width="461" height="120" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip36"><rect x="1066" y="664" width="461" height="120" rx="10"/></clipPath>
<g clip-path="url(#clip36)"><rect x="1066" y="664" width="461" height="5" fill="#B98BFF"/></g>
<text x="1084" y="700" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Recall first</text>
<text x="1084" y="721" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12.0" font-weight="400" fill="#63799B" text-anchor="start">640 px tiles · 50% overlap</text>
<text x="1084" y="739.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Strongest small-object recall</text>
<text x="1084" y="758.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Highest compute cost per frame</text>
<rect x="100" y="830" width="1444" height="76" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip37"><rect x="100" y="830" width="1444" height="76" rx="10"/></clipPath>
