<text x="822.0" y="864" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#EAF0FA" text-anchor="middle">Tile size and overlap are the only two knobs that matter, and they trade compute against small-object recall. Measure on the real image distribution before fixing them.</text>
