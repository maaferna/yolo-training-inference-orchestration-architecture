<text x="310" y="566" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" fill="#94A6C4" text-anchor="middle">overlap keeps boundary objects whole in at least one tile</text>
<text x="310" y="292" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#63799B" text-anchor="middle">4096 px frame  ·  640 px tiles  ·  50% overlap</text>
<rect x="560" y="240" width="380" height="340" rx="14" fill="#0E1524" stroke="#1F2E47" stroke-width="1.5"/>
<rect x="561.5" y="254" width="4" height="312" rx="2" fill="#7ED957" stroke="none" opacity="0.75"/>
<text x="580" y="267" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7ED957" text-anchor="start" letter-spacing="1.5">2 · DETECT</text>
<rect x="576" y="286" width="348" height="128" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip30"><rect x="576" y="286" width="348" height="128" rx="10"/></clipPath>
<g clip-path="url(#clip30)"><rect x="576" y="286" width="348" height="5" fill="#7ED957"/></g>
<text x="594" y="322" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Per-tile YOLO inference</text>
<text x="594" y="343" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Each tile is resized to the model</text>
<text x="594" y="361.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">input and inferred independently</text>
<text x="594" y="380.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">A 20 px object in the frame becomes</text>
<text x="594" y="398.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">a well-sized object inside its tile</text>
<rect x="576" y="430" width="348" height="134" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip31"><rect x="576" y="430" width="348" height="134" rx="10"/></clipPath>
<g clip-path="url(#clip31)"><rect x="576" y="430" width="348" height="5" fill="#FF6B6B"/></g>
<text x="594" y="466" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Cost of the strategy</text>
<text x="594" y="487" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Tile count grows with overlap:</text>
<text x="594" y="505.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">50% overlap on a 2x2 grid means</text>
<text x="594" y="524.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">roughly 4x the forward passes</text>
<text x="594" y="542.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">GPU memory stays flat, time does not</text>
<rect x="980" y="240" width="564" height="340" rx="14" fill="#0E1524" stroke="#1F2E47" stroke-width="1.5"/>
<rect x="981.5" y="254" width="4" height="312" rx="2" fill="#FFB13D" stroke="none" opacity="0.75"/>
<text x="1000" y="267" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#FFB13D" text-anchor="start" letter-spacing="1.5">3 · RECONSTRUCT</text>
<rect x="996" y="286" width="532" height="128" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip32"><rect x="996" y="286" width="532" height="128" rx="10"/></clipPath>
<g clip-path="url(#clip32)"><rect x="996" y="286" width="532" height="5" fill="#FFB13D"/></g>
<text x="1014" y="322" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Merge and deduplicate</text>
<text x="1014" y="343" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Tile-local coordinates are mapped back to full-frame coordinates,</text>
<text x="1014" y="361.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">then detections from overlapping tiles are merged with NMS over IoU</text>
<text x="1014" y="380.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">so the same object seen in two tiles is reported once.</text>
<rect x="996" y="430" width="532" height="134" rx="10" fill="#141E31" stroke="#2A3B58" stroke-width="1.5"/>
<clipPath id="clip33"><rect x="996" y="430" width="532" height="134" rx="10"/></clipPath>
<g clip-path="url(#clip33)"><rect x="996" y="430" width="532" height="5" fill="#FF7E8E"/></g>
<text x="1014" y="466" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" fill="#EAF0FA" text-anchor="start">Output artifacts</text>
<text x="1014" y="487" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Detection manifest: class, confidence, box, tile provenance</text>
<text x="1014" y="505.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Compressed preview for web visualization</text>
<text x="1014" y="524.0" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">Run summary and counts per class</text>
<text x="1014" y="542.5" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#94A6C4" text-anchor="start">GIS-compatible vector output when applicable</text>
