<text x="822.0" y="835" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#EAF0FA" text-anchor="middle">Reliability, traceability and artifact governance return more, at this scale, than any distributed component added ahead of the evidence for it.</text>
