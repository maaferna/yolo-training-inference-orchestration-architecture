<text x="132" y="654" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#FF6B6B" text-anchor="start">✕</text>
<text x="154" y="654" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#94A6C4" text-anchor="start">Workload volume is predictable and low</text>
