<text x="154" y="690" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#94A6C4" text-anchor="start">Users understand that jobs run long</text>
<text x="612" y="654" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#FF6B6B" text-anchor="start">✕</text>
<text x="634" y="654" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#94A6C4" text-anchor="start">One GPU is not yet contended</text>
<text x="612" y="690" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#FF6B6B" text-anchor="start">✕</text>
<text x="634" y="690" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#94A6C4" text-anchor="start">No uptime commitment exists yet</text>
<text x="1092" y="654" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#FF6B6B" text-anchor="start">✕</text>
<text x="1114" y="654" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#94A6C4" text-anchor="start">Traceability is the real gap, not throughput</text>
<text x="1092" y="690" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#FF6B6B" text-anchor="start">✕</text>
<text x="1114" y="690" font-family="Lato, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#94A6C4" text-anchor="start">The team cannot operate a scheduler today</text>
